plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'org.jetbrains.kotlin.jvm' version '2.2.21'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = "${project.findProperty('release_version') ?: mod_version}+mc${minecraft_version}"
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)
kotlin {
    jvmToolchain(21)
}

// Both GameTest source sets compile TestKit and TestWorld from kotlin-shared and load the structure templates from resources-shared.
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
        kotlin.srcDir 'src/gametest/kotlin-shared'
        resources.srcDir 'src/gametest/resources-shared'
    }
    gametestCore {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
        kotlin.srcDir 'src/gametest/kotlin-shared'
        resources.srcDir 'src/gametest/resources-shared'
    }
    // CD-QWK-27 to CD-QWK-32, CD-LND-06 to CD-LND-10: one claim mod each, on the mod set of the core run. CI does not run them.
    gametestFtbChunks {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
        kotlin.srcDir 'src/gametest/kotlin-shared'
        kotlin.srcDir 'src/gametest/kotlin-claims'
        resources.srcDir 'src/gametest/resources-shared'
    }
    gametestOpac {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
        kotlin.srcDir 'src/gametest/kotlin-shared'
        kotlin.srcDir 'src/gametest/kotlin-claims'
        resources.srcDir 'src/gametest/resources-shared'
    }
    // CD-LND-08, CD-LND-09: MineColonies and its three required libraries, on the mod set of the core run.
    gametestMineColonies {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
        kotlin.srcDir 'src/gametest/kotlin-shared'
        kotlin.srcDir 'src/gametest/kotlin-claims'
        resources.srcDir 'src/gametest/resources-shared'
    }
}

configurations {
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
    gametestImplementation.extendsFrom implementation
    gametestCompileOnly.extendsFrom compileOnly
    gametestRuntimeOnly.extendsFrom runtimeOnly
    gametestRuntimeClasspath.extendsFrom localRuntime
    // CD-PLAT-05: Cobblemon and KotlinForForge only. Neither localRuntime nor compileOnly, so the core tests cannot name Create.
    gametestCoreImplementation.extendsFrom implementation
    gametestCoreRuntimeOnly.extendsFrom runtimeOnly
    gametestFtbChunksImplementation.extendsFrom implementation
    gametestFtbChunksRuntimeOnly.extendsFrom runtimeOnly
    gametestOpacImplementation.extendsFrom implementation
    gametestOpacRuntimeOnly.extendsFrom runtimeOnly
    gametestMineColoniesImplementation.extendsFrom implementation
    gametestMineColoniesRuntimeOnly.extendsFrom runtimeOnly
}

repositories {
    maven {
        name = 'Kotlin for Forge'
        url = 'https://thedarkcolour.github.io/KotlinForForge/'
        content { includeGroup 'thedarkcolour' }
    }
    maven {
        name = 'Cobblemon'
        url = 'https://maven.impactdev.net/repository/development/'
        content { includeGroup 'com.cobblemon' }
    }
    maven {
        name = 'Create'
        url = 'https://maven.createmod.net'
        content {
            includeGroup 'com.simibubi.create'
            includeGroup 'net.createmod.ponder'
            includeGroup 'dev.engine-room.flywheel'
        }
    }
    maven {
        name = 'Registrate'
        url = 'https://maven.ithundxr.dev/snapshots'
        content { includeGroup 'com.tterrag.registrate' }
    }
    maven {
        name = 'FTB'
        url = 'https://maven.ftb.dev/releases'
        content { includeGroup 'dev.ftb.mods' }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven {
        name = 'LDTTeam'
        url = 'https://ldtteam.jfrog.io/ldtteam/modding/'
        content { includeGroup 'com.ldtteam' }
    }
    mavenCentral()
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    validateAccessTransformers = true

    addModdingDependenciesTo sourceSets.test
    addModdingDependenciesTo sourceSets.gametest
    addModdingDependenciesTo sourceSets.gametestCore
    addModdingDependenciesTo sourceSets.gametestFtbChunks
    addModdingDependenciesTo sourceSets.gametestOpac
    addModdingDependenciesTo sourceSets.gametestMineColonies

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
        cobblemon_dynamics_test {
            sourceSet sourceSets.gametest
        }
        cobblemon_dynamics_coretest {
            sourceSet sourceSets.gametestCore
        }
        cobblemon_dynamics_ftbtest {
            sourceSet sourceSets.gametestFtbChunks
        }
        cobblemon_dynamics_opactest {
            sourceSet sourceSets.gametestOpac
        }
        cobblemon_dynamics_mctest {
            sourceSet sourceSets.gametestMineColonies
        }
    }

    runs {
        client {
            client()
            gameDirectory = project.file('run/client')
            loadedMods = [mods."${mod_id}"]
        }
        server {
            server()
            programArgument '--nogui'
            gameDirectory = project.file('run/server')
            loadedMods = [mods."${mod_id}"]
        }
        gameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.gametest
            gameDirectory = project.file('run/gametest')
            loadedMods = [mods."${mod_id}", mods.cobblemon_dynamics_test]
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        // CD-PLAT-05, CD-CFG-10: the same mod on a server without Create and AE2.
        gameTestServerCore {
            type = 'gameTestServer'
            sourceSet = sourceSets.gametestCore
            gameDirectory = project.file('run/gametest-core')
            loadedMods = [mods."${mod_id}", mods.cobblemon_dynamics_coretest]
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        // CD-PERF-01, CD-PERF-02, CD-PERF-05: the reference world alone on its server. The namespace keeps PerfTests out of the other runs.
        gameTestServerPerf {
            type = 'gameTestServer'
            sourceSet = sourceSets.gametest
            gameDirectory = project.file('run/gametest-perf')
            loadedMods = [mods."${mod_id}", mods.cobblemon_dynamics_test]
            systemProperty 'neoforge.enabledGameTestNamespaces', 'cobblemon_dynamics_perf'
        }
        // The three claim runs: the mod set of the core run and one claim mod each (ADR-0013 Amendment 1, ADR-0014).
        gameTestServerFtbChunks {
            type = 'gameTestServer'
            sourceSet = sourceSets.gametestFtbChunks
            gameDirectory = project.file('run/gametest-ftbchunks')
            loadedMods = [mods."${mod_id}", mods.cobblemon_dynamics_ftbtest]
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        gameTestServerOpac {
            type = 'gameTestServer'
            sourceSet = sourceSets.gametestOpac
            gameDirectory = project.file('run/gametest-opac')
            loadedMods = [mods."${mod_id}", mods.cobblemon_dynamics_opactest]
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        gameTestServerMineColonies {
            type = 'gameTestServer'
            sourceSet = sourceSets.gametestMineColonies
            gameDirectory = project.file('run/gametest-minecolonies')
            loadedMods = [mods."${mod_id}", mods.cobblemon_dynamics_mctest]
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }
}

dependencies {
    implementation "thedarkcolour:kotlinforforge-neoforge:${kff_version}"
    implementation "com.cobblemon:neoforge:${cobblemon_version}"

    compileOnly("com.simibubi.create:create-1.21.1:${create_version}:slim") { transitive = false }
    compileOnly "net.createmod.ponder:ponder-neoforge:${ponder_version}"
    compileOnly "dev.engine-room.flywheel:flywheel-neoforge-api-1.21.1:${flywheel_version}"
    compileOnly "com.tterrag.registrate:Registrate:${registrate_version}"
    // CD-QWK-27, CD-QWK-28, CD-QWK-34: the claim mods stay optional. Only compat/ftbchunks/ and compat/opac/ name them.
    compileOnly("dev.ftb.mods:ftb-chunks-neoforge:${ftb_chunks_version}") { transitive = false }
    compileOnly("dev.ftb.mods:ftb-teams-neoforge:${ftb_teams_version}") { transitive = false }
    compileOnly("dev.ftb.mods:ftb-library-neoforge:${ftb_library_version}") { transitive = false }
    compileOnly("maven.modrinth:open-parties-and-claims:${opac_version}") { transitive = false }
    // CD-LND-08, CD-LND-09, CD-LND-14: MineColonies stays optional. Only compat/minecolonies/ names it. AbstractBlockHut
    // implements interfaces of Structurize, and IMinecoloniesAPI.getConfig() returns a class of BlockUI.
    compileOnly("com.ldtteam:minecolonies:${minecolonies_version}") { transitive = false }
    compileOnly("com.ldtteam:structurize:${structurize_version}") { transitive = false }
    compileOnly("com.ldtteam:blockui:${blockui_version}") { transitive = false }

    localRuntime("com.simibubi.create:create-1.21.1:${create_version}:slim") { transitive = false }
    localRuntime "net.createmod.ponder:ponder-neoforge:${ponder_version}"
    localRuntime "dev.engine-room.flywheel:flywheel-neoforge-1.21.1:${flywheel_version}"
    localRuntime "com.tterrag.registrate:Registrate:${registrate_version}"
    localRuntime "org.appliedenergistics:appliedenergistics2:${ae2_version}"
    // CD-GEN-07: the full GameTest run reads an AE2 grid's stored energy through AE2's API. The main source set never sees AE2 (CD-CRY-05).
    gametestCompileOnly("org.appliedenergistics:appliedenergistics2:${ae2_version}") { transitive = false }
    // The claim runs load the jars of COHO 2.4.0. They never go into a CI artifact or a log upload.
    gametestFtbChunksImplementation("dev.ftb.mods:ftb-chunks-neoforge:${ftb_chunks_version}") { transitive = false }
    gametestFtbChunksImplementation("dev.ftb.mods:ftb-teams-neoforge:${ftb_teams_version}") { transitive = false }
    gametestFtbChunksImplementation("dev.ftb.mods:ftb-library-neoforge:${ftb_library_version}") { transitive = false }
    gametestFtbChunksRuntimeOnly("maven.modrinth:architectury-api:${architectury_version}") { transitive = false }
    gametestOpacImplementation("maven.modrinth:open-parties-and-claims:${opac_version}") { transitive = false }
    gametestMineColoniesImplementation("com.ldtteam:minecolonies:${minecolonies_version}") { transitive = false }
    gametestMineColoniesImplementation("com.ldtteam:structurize:${structurize_version}") { transitive = false }
    gametestMineColoniesImplementation("com.ldtteam:blockui:${blockui_version}") { transitive = false }
    gametestMineColoniesRuntimeOnly("com.ldtteam:domum-ornamentum:${domum_ornamentum_version}:main") { transitive = false }

    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.tomlj:tomlj:2.2.0'
    testImplementation 'org.yaml:snakeyaml:2.7'
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version_range: minecraft_version_range,
            neo_version_range      : neo_version_range,
            kff_version_range      : kff_version_range,
            cobblemon_version_range: cobblemon_version_range,
            create_version_range   : create_version_range,
            ae2_version_range      : ae2_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : project.version.toString(),
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.named('test', Test) {
    useJUnitPlatform()
    dependsOn generateModMetadata
    systemProperty 'cd.modsToml', file('build/generated/sources/modMetadata/META-INF/neoforge.mods.toml').absolutePath
    systemProperty 'cd.projectDir', projectDir.absolutePath
    // Unit tests read these files by path. As inputs, a change to one runs the tests again instead of reusing a cached pass.
    inputs.files(fileTree(projectDir) {
        include 'LICENSE', 'README.md', 'build.gradle', 'gradle.properties', '.github/**', 'scripts/**', 'src/main/**', 'art/**',
                'docs/player-guide.md', 'docs/modpack-integration.md', 'docs/testing/**', 'docs/plans/2026-11-09-v1-spec-sheet.md'
        exclude '**/__pycache__/**'
    }).withPropertyName('repositoryFiles').withPathSensitivity(PathSensitivity.RELATIVE)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

// CD-PLAT-04, CD-REL-07: every class is Java 21 bytecode, no Cobblemon asset ships, no test class ships.
tasks.register('verifyJar') {
    group = 'verification'
    description = 'Checks the mod jar: class versions, no Cobblemon assets, no GameTest classes, the logo.'
    dependsOn tasks.named('jar')
    def jarFile = tasks.named('jar').flatMap { it.archiveFile }
    def logoSource = file('art/logo/logo-256.png')
    inputs.file jarFile
    inputs.file logoSource
    doLast {
        def problems = []
        new java.util.zip.ZipFile(jarFile.get().asFile).withCloseable { zip ->
            zip.entries().each { e ->
                if (e.name.endsWith('.class')) {
                    zip.getInputStream(e).withCloseable { s ->
                        def b = s.readNBytes(8)
                        int major = ((b[6] & 0xff) << 8) | (b[7] & 0xff)
                        if (major != 65) problems << "${e.name}: class file major version ${major}, expected 65"
                    }
                }
                if (e.name.startsWith('assets/cobblemon/')) problems << "${e.name}: copies a Cobblemon asset"
                // The claim mods are compile-only, the FTB jars are All Rights Reserved (ADR-0013, Amendment 1), and the code of
                // MineColonies is GPL 3.0 (ADR-0014).
                if (['dev/ftb/', 'xaero/', 'dev/architectury/', 'com/minecolonies/', 'com/ldtteam/'].any { e.name.startsWith(it) }) {
                    problems << "${e.name}: bundles a class of a claim mod"
                }
                if (e.name.startsWith('codes/honor/cobblemondynamics/test/') || e.name.startsWith('codes/honor/cobblemondynamics/coretest/')) {
                    problems << "${e.name}: GameTest class in the jar"
                }
            }
            def logo = zip.getEntry('logo.png')
            if (logo == null) {
                problems << 'logo.png: missing'
            } else if (zip.getInputStream(logo).bytes != logoSource.bytes) {
                problems << 'logo.png: differs from art/logo/logo-256.png'
            }
        }
        if (!problems.isEmpty()) throw new GradleException("verifyJar failed:\n" + problems.join('\n'))
    }
}

// CD-CRY-05: the main source set never imports AE2 and has no AE2 compile dependency.
tasks.register('verifyNoAe2') {
    group = 'verification'
    description = 'Fails if the main source set imports appeng or compiles against AE2.'
    def mainSources = fileTree('src/main') { include '**/*.kt', '**/*.java' }
    inputs.files mainSources
    doLast {
        def bad = mainSources.files.findAll { it.text =~ /(?m)^\s*import\s+appeng\./ }
        if (!bad.isEmpty()) throw new GradleException("AE2 imports in src/main: ${bad*.path}")
        def ae2 = configurations.compileClasspath.resolvedConfiguration.resolvedArtifacts.findAll {
            it.moduleVersion.id.group == 'org.appliedenergistics'
        }
        if (!ae2.isEmpty()) throw new GradleException("AE2 on the main compile classpath: ${ae2*.name}")
    }
}

tasks.named('check') {
    dependsOn 'verifyJar', 'verifyNoAe2'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            groupId = mod_group_id
            artifactId = mod_artifact_id
            from components.java
        }
    }
    repositories {
        maven { url = "file://${project.projectDir}/repo" }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
