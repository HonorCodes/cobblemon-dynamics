name: security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
      - name: Compile for analysis
        run: ./gradlew compileJava compileKotlin --no-build-cache --rerun-tasks
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:java-kotlin

  # The dependency graph sees Gradle dependencies only through this submission.
  # Pull requests from forks and from Dependabot get a read-only token, so they skip it.
  dependency-submission:
    name: Dependency graph
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/dependency-submission@v6
        with:
          # Only the classpaths that the mod and its tests compile and run with.
          # Configurations that only build tools resolve stay out of the graph.
          dependency-graph-include-configurations: >-
            compileClasspath|runtimeClasspath|testCompileClasspath|testRuntimeClasspath|gametestCompileClasspath|gametestRuntimeClasspath
        env:
          # The mod's runtime classpath has runtime scope. The test classpaths have development scope.
          DEPENDENCY_GRAPH_RUNTIME_INCLUDE_CONFIGURATIONS: '^runtimeClasspath$'

  dependency-review:
    name: Dependency review
    needs: dependency-submission
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          fail-on-scopes: runtime
          comment-summary-in-pr: on-failure
          retry-on-snapshot-warnings: true
